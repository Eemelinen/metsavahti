name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  checks:
    name: Lint · typecheck · unit · integration · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm format:check
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (Testcontainers → PostGIS + Mailpit)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
      - name: Build (Turbopack)
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: '1'
          DATABASE_URL: postgres://build:build@localhost:5432/build_test
          PAYLOAD_SECRET: ci-build-only-secret-not-used
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          WFS_BASE_URL: https://avoin.metsakeskus.fi/rajapinnat/v1/ows/
          CRON_SECRET: ci-build-only
          EMAIL_FROM: ci@example.com
          EXPORTS_DIR: exports

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    services:
      db_test:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: metsavahti
          POSTGRES_PASSWORD: metsavahti
          POSTGRES_DB: metsavahti_e2e
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U metsavahti -d metsavahti_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build and run E2E against the production server
        run: pnpm test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
